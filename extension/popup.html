<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimLens</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        width: 360px;
        min-height: 420px;
        max-height: 600px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .popup-wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .popup-header {
        background: var(--ink);
        color: var(--paper);
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .popup-header .logo {
        width: 22px;
        height: 22px;
        background: var(--lime);
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
      }
      .popup-header .logo::after {
        content: "";
        position: absolute;
        inset: 5px;
        border: 2px solid var(--ink);
        border-radius: 50%;
      }
      .popup-header h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .popup-header .sub {
        font-size: 10.5px;
        color: var(--lime);
        font-family: var(--font-mono);
        margin-top: 1px;
      }
      .popup-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }
      .page-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .page-card .title {
        font-weight: 600;
        font-size: 12.5px;
        margin-bottom: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page-card .url {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--slate);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .capture-btn {
        width: 100%;
        justify-content: center;
        padding: 10px;
        font-size: 13.5px;
        margin-bottom: 10px;
      }
      .section-label {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--slate);
        margin: 14px 0 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .section-label .count {
        font-family: var(--font-mono);
        background: var(--paper-2);
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 10px;
      }
      .recent-item {
        padding: 10px 0;
        border-top: 1px solid var(--border);
        cursor: pointer;
      }
      .recent-item:hover .claim-text {
        color: var(--olive);
      }
      .recent-item .claim-text {
        font-family: var(--font-serif);
        font-size: 13.5px;
        line-height: 1.4;
        margin-bottom: 4px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: color 0.12s ease;
      }
      .recent-item .meta {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--slate);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .recent-item .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--slate);
        flex-shrink: 0;
      }
      .recent-item .status-dot.supported {
        background: var(--support);
      }
      .recent-item .status-dot.contradicted {
        background: var(--contradict);
      }
      .recent-item .status-dot.investigating {
        background: var(--lime-dark);
      }
      .popup-footer {
        border-top: 1px solid var(--border);
        padding: 10px 14px;
        display: flex;
        gap: 8px;
        background: var(--paper-2);
      }
      .popup-footer button {
        flex: 1;
        justify-content: center;
        font-size: 12px;
        padding: 8px 6px;
      }
      .alert {
        padding: 9px 11px;
        border-radius: var(--radius);
        font-size: 12px;
        margin-bottom: 10px;
        line-height: 1.45;
      }
      .alert--warn {
        background: var(--contradict-bg);
        color: var(--contradict);
        border: 1px solid #ddc3bd;
      }
      .alert--ok {
        background: var(--support-bg);
        color: var(--support);
        border: 1px solid #c3d6cd;
      }
      .alert--info {
        background: var(--neutral-bg);
        color: var(--neutral);
        border: 1px solid #c5d0db;
      }
      .search-row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .search-row input {
        flex: 1;
        padding: 7px 10px;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <div class="popup-wrap" id="app"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
