<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ClaimLens — Settings</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        padding: 0;
        background: var(--paper);
      }
      .opts-wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }
      .opts-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }
      .opts-header .logo {
        width: 32px;
        height: 32px;
        background: var(--ink);
        border-radius: 50%;
        position: relative;
        flex-shrink: 0;
      }
      .opts-header .logo::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 2.5px solid var(--lime);
        border-radius: 50%;
      }
      .opts-header h1 {
        font-size: 22px;
      }
      .opts-header .sub {
        font-size: 12px;
        color: var(--slate);
        font-family: var(--font-mono);
      }
      .opts-section {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 24px 28px;
        margin-bottom: 20px;
      }
      .opts-section h2 {
        font-size: 15px;
        margin-bottom: 4px;
      }
      .opts-section .desc {
        font-size: 13px;
        color: var(--slate);
        margin-bottom: 18px;
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 12px 0;
        border-top: 1px solid var(--border);
      }
      .setting-row:first-of-type {
        border-top: 0;
      }
      .setting-row .label {
        font-weight: 500;
        font-size: 13.5px;
        margin-bottom: 2px;
      }
      .setting-row .help {
        font-size: 12px;
        color: var(--slate);
        max-width: 420px;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch .track {
        position: absolute;
        inset: 0;
        background: var(--border-strong);
        border-radius: 999px;
        transition: background 0.15s ease;
        cursor: pointer;
      }
      .switch .track::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        background: var(--white);
        border-radius: 50%;
        top: 3px;
        left: 3px;
        transition: transform 0.15s ease;
      }
      .switch input:checked + .track {
        background: var(--ink);
      }
      .switch input:checked + .track::before {
        transform: translateX(18px);
        background: var(--lime);
      }
      .danger-zone {
        border-color: var(--contradict);
      }
      .privacy-list {
        font-size: 13px;
        color: var(--slate);
        line-height: 1.7;
        padding-left: 18px;
        margin: 0;
      }
      .privacy-list li::marker {
        color: var(--olive);
      }
      .kbd {
        font-family: var(--font-mono);
        font-size: 11px;
        background: var(--paper-2);
        border: 1px solid var(--border-strong);
        border-radius: 3px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <div class="opts-wrap" id="app"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
